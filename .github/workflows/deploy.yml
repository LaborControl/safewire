# =============================================================================
# SAFEWIRE CD Pipeline - Deploy to Scaleway
# =============================================================================
# Triggered after CI passes on main branch
# Builds Docker image, pushes to Scaleway Container Registry,
# and deploys to Scaleway Serverless Containers
#
# Required for AC4, AC5, AC6, AC7, AC8
#
# =============================================================================
# REQUIRED GITHUB SECRETS (configure in Settings > Secrets and variables > Actions)
# =============================================================================
# SCW_ACCESS_KEY         - Scaleway IAM access key (from console.scaleway.com)
# SCW_SECRET_KEY         - Scaleway IAM secret key
# SCW_CONTAINER_ID       - Scaleway Serverless Container ID (after first manual deploy)
# DATABASE_URL           - Production PostgreSQL connection string
# NEXTAUTH_SECRET        - Auth.js session encryption key (generate: openssl rand -base64 32)
# NEXTAUTH_URL           - Production URL (e.g., https://app.safewire.fr)
# NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY - Stripe publishable key (optional)
# =============================================================================

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: "Deployment environment"
        required: true
        default: "production"
        type: choice
        options:
          - production
          - staging

# Only allow one deployment at a time
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: rg.fr-par.scw.cloud
  NAMESPACE: safewire
  IMAGE_NAME: safewire-app
  REGION: fr-par

jobs:
  # First, run CI checks
  ci:
    name: Run CI Checks
    uses: ./.github/workflows/ci.yml

  # Build and push Docker image
  build:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: ci
    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
      image_digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Scaleway Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: nologin
          password: ${{ secrets.SCW_SECRET_KEY }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./safewire-app
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}

      - name: Output image info
        run: |
          echo "Image pushed successfully!"
          echo "Tags: ${{ steps.meta.outputs.tags }}"
          echo "Digest: ${{ steps.build.outputs.digest }}"

  # Deploy to Scaleway Serverless Containers
  deploy:
    name: Deploy to Scaleway
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: production
      url: https://app.safewire.fr

    steps:
      - name: Install Scaleway CLI
        run: |
          curl -s https://raw.githubusercontent.com/scaleway/scaleway-cli/master/scripts/get.sh | sh
          scw version

      - name: Configure Scaleway CLI
        env:
          SCW_ACCESS_KEY: ${{ secrets.SCW_ACCESS_KEY }}
          SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
          SCW_DEFAULT_REGION: ${{ env.REGION }}
          SCW_DEFAULT_ZONE: fr-par-1
        run: |
          # Configure CLI via config file (non-interactive)
          mkdir -p ~/.config/scw
          cat > ~/.config/scw/config.yaml << EOF
          access_key: $SCW_ACCESS_KEY
          secret_key: $SCW_SECRET_KEY
          default_region: $SCW_DEFAULT_REGION
          default_zone: $SCW_DEFAULT_ZONE
          EOF

      - name: Deploy container
        env:
          SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
          CONTAINER_ID: ${{ secrets.SCW_CONTAINER_ID }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          # Update the container with the new image
          scw container container update \
            "$CONTAINER_ID" \
            registry-image="${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.IMAGE_NAME }}:$IMAGE_TAG" \
            region=${{ env.REGION }}

          # Redeploy the container to apply changes
          scw container container deploy \
            "$CONTAINER_ID" \
            region=${{ env.REGION }}

          echo "Deployment initiated successfully!"

      - name: Wait for deployment
        env:
          CONTAINER_ID: ${{ secrets.SCW_CONTAINER_ID }}
        run: |
          echo "Waiting for container to be ready..."
          for i in {1..30}; do
            STATUS=$(scw container container get "$CONTAINER_ID" region=${{ env.REGION }} -o json | jq -r '.status')
            echo "Attempt $i: Container status is $STATUS"
            if [ "$STATUS" = "ready" ]; then
              echo "Container is ready!"
              exit 0
            fi
            sleep 10
          done
          echo "Timeout waiting for container to be ready"
          exit 1

      - name: Health check
        env:
          CONTAINER_ID: ${{ secrets.SCW_CONTAINER_ID }}
        run: |
          # Get the container endpoint
          ENDPOINT=$(scw container container get "$CONTAINER_ID" region=${{ env.REGION }} -o json | jq -r '.domain_name')
          echo "Container endpoint: $ENDPOINT"

          # Wait for health check to pass
          for i in {1..10}; do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "https://$ENDPOINT/api/health" || echo "000")
            echo "Attempt $i: Health check returned $HTTP_CODE"
            if [ "$HTTP_CODE" = "200" ]; then
              echo "Health check passed!"
              exit 0
            fi
            sleep 5
          done
          echo "Health check failed after 10 attempts"
          exit 1

      - name: Deployment summary
        if: success()
        run: |
          echo "## Deployment Successful! :rocket:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Image:** ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.IMAGE_NAME }}:${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Region:** ${{ env.REGION }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
